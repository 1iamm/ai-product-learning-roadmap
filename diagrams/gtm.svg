<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">gtm</title><desc id="desc">PostHog 定位开发者，以开源和自托管形成差异，先直接触达帮助使用，再公开发布和内容获客。教学判断同时测量合格客户、激活、付费与成本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">GTM：让产品价值在目标客户那里被看见</text><rect x="30" y="88" width="230" height="98" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="145.0" y="121.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">目标人群</text><text x="145.0" y="153.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">开发者</text><rect x="325" y="88" width="230" height="98" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="121.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">差异与理由</text><text x="440.0" y="153.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">开源 / 可自托管</text><rect x="620" y="88" width="230" height="98" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="735.0" y="121.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">触达渠道</text><text x="735.0" y="153.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">直接联系 → 社区内容</text><polyline points="260,137 320,137" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="555,137 615,137" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="285" width="230" height="98" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="735.0" y="318.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">下一步动作</text><text x="735.0" y="350.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">试用、体验、购买</text><rect x="325" y="285" width="230" height="98" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="318.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">反馈与定位修订</text><text x="440.0" y="350.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">谁回来？谁愿付费？</text><rect x="30" y="285" width="230" height="98" rx="9" fill="#fcf5e9" stroke="#c0a06c" stroke-width="2"/><text x="145.0" y="318.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">教学渠道实验</text><text x="145.0" y="350.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">目标 / 证据 / 停止条件</text><polyline points="735,186 735,285" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,334 560,334" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="325,334 265,334" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="439" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">衡量：合格客户数、激活与付费；同时算人工、内容和渠道投入</text></g></svg>