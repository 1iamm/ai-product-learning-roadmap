<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">flowchart</title><desc id="desc">开始于选中画框。判断是否要隐藏超出画框的内容：是则开启裁剪，否则关闭裁剪。两路都检查预览后结束。箭头不代表界面布局。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">Flowchart：判断与分支，先不关心按钮位置</text><rect x="35" y="180" width="145" height="72" rx="36.0" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="107.5" y="216.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">选中画框</text><path d="M347.5 130L465 217.5L347.5 305L230 217.5Z" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="347.5" y="201.5" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">要隐藏</text><text x="347.5" y="233.5" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">超出内容？</text><polyline points="180,216 230,216" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="80" width="180" height="62" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="620.0" y="111.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">开启裁剪</text><rect x="530" y="317" width="180" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="620.0" y="348.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">关闭裁剪</text><polyline points="347,130 347,111 530,111" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="92" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">是</text><polyline points="347,305 347,348 530,348" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="328" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">否</text><rect x="712" y="180" width="140" height="72" rx="36.0" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="782.0" y="200.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">检查预览</text><text x="782.0" y="232.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">完成</text><polyline points="710,111 782,111 782,180" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="710,348 782,348 782,252" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="441" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">图例：圆角起止 · 菱形判断 · 矩形动作 · 分支写清条件</text></g></svg>