<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">value</title><desc id="desc">先明确买方认可的结果，再决定收费模式与计价单位，研究付费意愿，结合使用与成本建模，最后以真实采用和付费检验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">定价从价值定义开始，持续用真实行为修正</text><rect x="30" y="90" width="230" height="100" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="145.0" y="124.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">买方价值</text><text x="145.0" y="156.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">谁为哪种结果买单？</text><rect x="325" y="90" width="230" height="100" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="124.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">计价单位</text><text x="440.0" y="156.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">什么发生一次要收费？</text><rect x="620" y="90" width="230" height="100" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="735.0" y="124.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">付费意愿</text><text x="735.0" y="156.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">意向价格与接受程度</text><polyline points="260,140 320,140" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="555,140 615,140" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="280" width="230" height="100" rx="9" fill="#fcf5e9" stroke="#c0a06c" stroke-width="2"/><text x="735.0" y="298.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">商业建模</text><text x="735.0" y="330.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">采用 × 用量 × 实现价格</text><text x="735.0" y="362.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">再核对各项成本</text><rect x="325" y="280" width="230" height="100" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="314.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">真实行为检验</text><text x="440.0" y="346.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">成交 / 持续用 / 续费</text><rect x="30" y="280" width="230" height="100" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="145.0" y="314.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">修订或停止</text><text x="145.0" y="346.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">价值、计价与打包</text><polyline points="735,190 735,280" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,330 560,330" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="325,330 265,330" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="145,280 145,195" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="442" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">护栏：客户能预测账单；计价可解释；收入增长不靠伤害客户结果</text></g></svg>