<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">metrics</title><desc id="desc">判断需求价值需检验评分质量、用户任务成功、客户结果；产品层面另查持续采用、续费和成本。每个指标需要口径、时间窗口、来源与护栏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="24" fill="#24374c">目标：帮助客户发现并改善服务问题（教学假设）</text><rect x="275" y="74" width="330" height="58" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="103.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">用户是否获得实际改善</text><rect x="30" y="194" width="230" height="88" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="145.0" y="222.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">能力质量</text><text x="145.0" y="254.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">评分与人工一致？</text><polyline points="440,132 440,156 145,156 145,194" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="194" width="230" height="88" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="222.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">任务成功</text><text x="440.0" y="254.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">用户能解释并行动？</text><polyline points="440,132 440,156 440,156 440,194" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="194" width="230" height="88" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="735.0" y="222.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">客户结果</text><text x="735.0" y="254.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">真实服务问题减少？</text><polyline points="440,132 440,156 735,156 735,194" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="327" width="380" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="220.0" y="358.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">任务指标：成功率、严重错误、耗时</text><rect x="440" y="327" width="410" height="62" rx="9" fill="#fcf5e9" stroke="#c0a06c" stroke-width="2"/><text x="645.0" y="358.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">护栏：漏报、误伤、额外工作与成本</text><text x="440" y="438" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">产品层面再查：持续采用 / 分群续费 / 收入与交付支持成本</text></g></svg>