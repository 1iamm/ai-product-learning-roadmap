<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">priority</title><desc id="desc">教学表：比较专用请求流程、通用字段与暂用模板。未知的覆盖、影响、成本不填虚构数字。先查决定选择的证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="32" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">同一目标与周期，才能比较候选项</text><rect x="30" y="80" width="220" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="140.0" y="106.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">候选方案</text><rect x="250" y="80" width="225" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="362.5" y="106.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">支持证据</text><rect x="475" y="80" width="230" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="590.0" y="106.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">最大未知</text><rect x="705" y="80" width="145" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="777.5" y="106.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">当前动作</text><rect x="30" y="132" width="220" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="140.0" y="171.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">专用请求流程</text><rect x="250" y="132" width="225" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="362.5" y="171.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">存在客户背景诉求</text><rect x="475" y="132" width="230" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="590.0" y="171.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">覆盖多少客户？</text><rect x="705" y="132" width="145" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="777.5" y="171.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">访谈核实</text><rect x="30" y="210" width="220" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="140.0" y="249.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">通用字段</text><rect x="250" y="210" width="225" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="362.5" y="249.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">支持自由表达</text><rect x="475" y="210" width="230" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="590.0" y="249.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">配置成本多大？</text><rect x="705" y="210" width="145" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="777.5" y="249.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">原型比较</text><rect x="30" y="288" width="220" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="140.0" y="327.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">先用固定模板</text><rect x="250" y="288" width="225" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="362.5" y="327.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">可低成本试探</text><rect x="475" y="288" width="230" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="590.0" y="327.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">能否完成任务？</text><rect x="705" y="288" width="145" height="78" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="777.5" y="327.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">短期试用</text><rect x="30" y="401" width="820" height="51" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="426.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">选择理由 = 用户价值 + 证据 + 产品方向 + 投入与机会成本</text></g></svg>