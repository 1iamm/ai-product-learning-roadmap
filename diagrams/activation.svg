<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">activation</title><desc id="desc">Appfire 四阶段激活：注册、设置、首次价值、形成习惯。为每个阶段定义同一账户口径和窗口，找到流失位置再选择干预。图不含实际转化率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">同一批账户、同一窗口，追踪到真正价值</text><rect x="90" y="75" width="700" height="66" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="92.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">注册</text><text x="440.0" y="124.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">有资格进入试用</text><polyline points="440,141 440,156" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="156" width="560" height="66" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="173.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">设置</text><text x="440.0" y="205.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">关键前提准备好</text><polyline points="440,222 440,237" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="237" width="420" height="66" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="254.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">首次价值</text><text x="440.0" y="286.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">完成一个真实任务</text><polyline points="440,303 440,318" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="318" width="280" height="66" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="335.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">形成习惯</text><text x="440.0" y="367.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">在需要时再次使用</text><text x="440" y="433" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">运营动作：先查瓶颈，再选入口提示、任务模板或人工辅导</text><text x="440" y="461" dominant-baseline="middle" text-anchor="middle" font-size="19" fill="#24374c">验证：分群激活率 / 首次价值时间 / 后续留存；不要只数引导完成</text></g></svg>