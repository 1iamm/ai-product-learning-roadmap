<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">breadboard</title><desc id="desc">位置是日历页与下方事件列表。点击有点日期把相应事件滚入视野。保留月历定位，排除拖拽与颜色分类；空日期提示是教学补充。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="32" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">先解决任务：找到某天的安排</text><text x="45" y="100" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">日历页</text><line x1="45" y1="119" x2="365" y2="119" stroke="#52647c" stroke-width="3"/><rect x="45" y="117" width="320" height="2" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="45" y="155" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">查看两个月日期</text><text x="45" y="189" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">点击有点的日期</text><text x="485" y="100" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">同页 · 事件列表</text><line x1="485" y1="119" x2="805" y2="119" stroke="#52647c" stroke-width="3"/><rect x="485" y="117" width="320" height="2" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="485" y="155" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">看到对应日期的事件</text><text x="485" y="189" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">阅读时间与安排</text><text x="485" y="280" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">同页 · 无事件提示</text><line x1="485" y1="299" x2="805" y2="299" stroke="#52647c" stroke-width="3"/><rect x="485" y="297" width="320" height="2" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="485" y="335" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">显示当天无安排</text><text x="485" y="369" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">可返回选择其他日期</text><polyline points="276,189 440,189 440,155 478,155" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="355" y="140" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">点击 → 滚动定位</text><text x="45" y="282" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">点击空日期（教学补充）</text><polyline points="290,283 410,283 410,333 478,333" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="417" width="820" height="42" rx="9" fill="#fcf5e9" stroke="#c0a06c" stroke-width="2"/><text x="440.0" y="438.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">范围外：拖拽排期、颜色分类；是否需要编辑另作决策</text></g></svg>