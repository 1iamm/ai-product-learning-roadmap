<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">sales</title><desc id="desc">确认真实问题、确认是否匹配、针对任务演示、以明确成功条件试用、解决预算决策和采购顾虑、交接客户成果。教学路径不是所有企业统一的顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">不是一次 Demo，而是一串客户的决定</text><rect x="30" y="88" width="230" height="105" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="145.0" y="124.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">问题确认</text><text x="145.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">值得现在解决吗？</text><rect x="325" y="88" width="230" height="105" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="124.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">方案匹配</text><text x="440.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">为什么选择你？</text><rect x="620" y="88" width="230" height="105" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="735.0" y="124.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">价值验证</text><text x="735.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">试用能完成什么？</text><polyline points="260,140 320,140" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="555,140 615,140" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="289" width="230" height="105" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="735.0" y="325.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">购买决定</text><text x="735.0" y="357.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">预算、顾虑、采购步骤</text><rect x="325" y="289" width="230" height="105" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="325.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">交接与首次价值</text><text x="440.0" y="357.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">把销售承诺带入使用</text><rect x="30" y="289" width="230" height="105" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="145.0" y="325.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">持续验证</text><text x="145.0" y="357.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">留下 / 扩展 / 停止</text><polyline points="735,193 735,289" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,342 560,342" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="325,342 265,342" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="438" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">每一步：客户要确认什么？你有什么证据？约定的下一步是什么？</text></g></svg>