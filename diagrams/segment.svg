<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">segment</title><desc id="desc">按失去产品后的感受分群，再看核心收益是否契合。分群帮助选择目标客户，不等于总体产品变好。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="32" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">先分清谁在反馈，再判断改善什么</text><rect x="265" y="70" width="350" height="64" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="102.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">已体验核心价值的受访用户</text><rect x="30" y="205" width="230" height="74" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="145.0" y="242.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">非常失望</text><polyline points="440,134 440,164 145,164 145,205" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="320" width="230" height="84" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="145.0" y="362.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">识别并强化核心收益</text><polyline points="145,279 145,320" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="205" width="230" height="74" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="242.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">有些失望</text><polyline points="440,134 440,164 440,164 440,205" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="320" width="230" height="84" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="440.0" y="346.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">再问：是否重视核心收</text><text x="440.0" y="378.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">益？</text><polyline points="440,279 440,320" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="205" width="230" height="74" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="735.0" y="242.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">不失望</text><polyline points="440,134 440,164 735,164 735,205" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="320" width="230" height="84" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="735.0" y="362.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">暂不作为核心方向依据</text><polyline points="735,279 735,320" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="450" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">迁移到企业 SaaS：另查使用者、买方的价值与续费证据</text></g></svg>