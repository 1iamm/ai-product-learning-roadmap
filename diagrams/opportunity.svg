<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">opportunity</title><desc id="desc">教学假设：缩短有依据的需求判断时间。机会是难找到客户背景与难判断影响。专用流程和通用字段是方案，访谈与原型是验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">假设目标：缩短有依据的需求判断时间</text><text x="25" y="63" dominant-baseline="middle" text-anchor="start" font-size="19" fill="#617086">目标口径与所有节点均需进一步验证</text><rect x="275" y="92" width="330" height="58" rx="9" fill="#eef6f1" stroke="#80a18c" stroke-width="2"/><text x="440.0" y="121.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">目标结果（教学假设）</text><rect x="70" y="198" width="325" height="62" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="232.5" y="229.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">机会：难找到请求的客户背景</text><rect x="485" y="198" width="325" height="62" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="647.5" y="229.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">机会：难判断问题的影响</text><polyline points="440,150 440,173 232,173 232,198" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="440,150 440,173 647,173 647,198" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="307" width="190" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="125.0" y="338.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">专用请求流程</text><rect x="245" y="307" width="190" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="340.0" y="338.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">通用字段 + 模板</text><rect x="460" y="307" width="190" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="555.0" y="338.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">集中展示证据</text><rect x="675" y="307" width="175" height="62" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="762.5" y="338.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">定期访谈摘要</text><polyline points="232,260 232,281 125,281 125,307" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="232,260 232,281 340,281 340,307" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="647,260 647,281 555,281 555,307" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="647,260 647,281 762,281 762,307" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="75" y="410" width="730" height="46" rx="9" fill="#fcf5e9" stroke="#c0a06c" stroke-width="2"/><text x="440.0" y="433.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">验证：用同一历史请求，比较两方案能否还原背景与作出判断</text><polyline points="125,369 125,410" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="340,369 340,410" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>