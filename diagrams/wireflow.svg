<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">wireflow</title><desc id="desc">两种候选设计对比。菜单方案：属性面板点击菜单，菜单选择裁剪开启，回到结果。直接复选框方案：点击未选中控件，显示已开启及预览反馈；再点击恢复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">Wireflow：连起具体操作与下一状态</text><text x="30" y="72" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">方案 A · 菜单设置（教学重构）</text><rect x="30" y="105" width="200" height="110" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="45" y="129" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">属性</text><rect x="340" y="105" width="200" height="110" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="355" y="129" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">裁剪菜单</text><rect x="650" y="105" width="200" height="110" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="665" y="129" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">结果</text><rect x="50" y="157" width="150" height="38" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="125.0" y="176.0" dominant-baseline="middle" text-anchor="middle" font-size="19" fill="#24374c">裁剪 …</text><rect x="360" y="157" width="150" height="38" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="435.0" y="176.0" dominant-baseline="middle" text-anchor="middle" font-size="19" fill="#24374c">开启</text><text x="666" y="178" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">内容已裁剪</text><polyline points="200,176 335,176" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="270" y="147" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">点击菜单</text><polyline points="510,176 645,176" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580" y="147" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">选择开启</text><text x="30" y="264" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">方案 B · 直接复选框（教学重构）</text><rect x="30" y="300" width="270" height="104" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="50" y="322" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">属性</text><rect x="50" y="350" width="27" height="27" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="90" y="365" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">裁剪内容</text><rect x="560" y="300" width="290" height="104" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="580" y="322" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">属性 / 预览</text><rect x="580" y="350" width="27" height="27" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="594" y="364" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">✓</text><text x="620" y="364" dominant-baseline="middle" text-anchor="start" font-size="21" fill="#24374c">已裁剪</text><polyline points="180,365 554,365" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="340" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">点击 → 状态与预览更新</text><polyline points="594,379 594,441 64,441 64,379" fill="none" stroke="#62758e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330" y="462" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">再次点击 → 恢复显示</text></g></svg>