<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">lifecycle</title><desc id="desc">教学运营表：未激活查障碍并辅导，使用下降先核实原因，新成员加入重新引导，续费前回顾客户成果，价值扩大时再讨论增购。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">运营动作应由客户处境触发</text><rect x="30" y="70" width="230" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="145.0" y="96.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">触发信号</text><rect x="260" y="70" width="290" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="405.0" y="96.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">帮助动作</text><rect x="550" y="70" width="300" height="52" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="700.0" y="96.0" dominant-baseline="middle" text-anchor="middle" font-size="22" fill="#24374c">确认结果</text><rect x="30" y="122" width="230" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="145.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">始终未激活</text><rect x="260" y="122" width="290" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="405.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">定位卡点 / 提供辅导</text><rect x="550" y="122" width="300" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="700.0" y="156.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">核心任务是否完成</text><rect x="30" y="191" width="230" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="145.0" y="225.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">使用持续下降</text><rect x="260" y="191" width="290" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="405.0" y="225.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">核实需求、障碍或季节性</text><rect x="550" y="191" width="300" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="700.0" y="225.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">是否仍有待解决问题</text><rect x="30" y="260" width="230" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="145.0" y="294.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">新成员 / 新情境</text><rect x="260" y="260" width="290" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="405.0" y="294.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">重新引导与任务示范</text><rect x="550" y="260" width="300" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="700.0" y="294.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">新成员是否获得价值</text><rect x="30" y="329" width="230" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="145.0" y="363.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">临近续费 / 价值扩大</text><rect x="260" y="329" width="290" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="405.0" y="363.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">成果回顾 / 合适的增购</text><rect x="550" y="329" width="300" height="69" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="700.0" y="363.5" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">续费意愿与双方成本</text><text x="440" y="440" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">分开看：客户留存、GRR、NRR；同时检查运营触达与服务负担</text></g></svg>