<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">coverage</title><desc id="desc">模板矩阵以列表、详情、分栏为行，正常、空、错误、窄屏键盘为列。每格指定检查项，空白意味着未检查，不是假通过。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">一套规则，要在不同任务与状态下成立</text><rect x="30" y="76" width="150" height="58" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="105.0" y="105.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">视图</text><rect x="180" y="76" width="170" height="58" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="265.0" y="105.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">正常内容</text><rect x="350" y="76" width="165" height="58" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="432.5" y="105.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">空状态</text><rect x="515" y="76" width="170" height="58" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="600.0" y="105.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">错误 / 失败</text><rect x="685" y="76" width="165" height="58" rx="9" fill="#edf2fa" stroke="#7d96bd" stroke-width="2"/><text x="767.5" y="105.0" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">窄屏 / 键盘</text><rect x="30" y="134" width="150" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="105.0" y="175.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">列表</text><rect x="180" y="134" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="265.0" y="175.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">主次可辨</text><rect x="350" y="134" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="432.5" y="175.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">知道如何开始</text><rect x="515" y="134" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="600.0" y="175.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">保留筛选条件</text><rect x="685" y="134" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="767.5" y="175.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">焦点可见</text><rect x="30" y="216" width="150" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="105.0" y="257.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">详情</text><rect x="180" y="216" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="265.0" y="257.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">关键状态可见</text><rect x="350" y="216" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="432.5" y="257.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">提示缺失内容</text><rect x="515" y="216" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="600.0" y="257.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">能恢复修改</text><rect x="685" y="216" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="767.5" y="257.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">字段有标签</text><rect x="30" y="298" width="150" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="105.0" y="339.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">分栏</text><rect x="180" y="298" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="265.0" y="339.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">当前对象明确</text><rect x="350" y="298" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="432.5" y="339.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">知道哪栏为空</text><rect x="515" y="298" width="170" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="600.0" y="339.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">错误位置明确</text><rect x="685" y="298" width="165" height="82" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="767.5" y="339.0" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">能回到列表</text><text x="440" y="436" dominant-baseline="middle" text-anchor="middle" font-size="21" fill="#24374c">检查后写下证据与问题。这里没有替你标记“通过”。</text></g></svg>