<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">wireframe</title><desc id="desc">教学线框：画框属性界面包含选中对象、预览、裁剪复选框和解释。线框用于信息布局，不表示页面跳转。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62758e"/></marker></defs><rect width="880" height="480" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="30" dominant-baseline="middle" text-anchor="start" font-size="25" fill="#24374c">Wireframe：只看一个状态的信息布局</text><rect x="40" y="78" width="800" height="340" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><rect x="60" y="100" width="180" height="290" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="150.0" y="213.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">图层</text><text x="150.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">Frame 1</text><text x="150.0" y="277.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">  图形 A</text><rect x="263" y="100" width="330" height="290" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><rect x="300" y="165" width="250" height="160" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="425.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-size="23" fill="#24374c">Frame 预览</text><rect x="615" y="100" width="205" height="290" rx="9" fill="#f7f8fa" stroke="#b7c1ce" stroke-width="2"/><text x="633" y="132" dominant-baseline="middle" text-anchor="start" font-size="23" fill="#24374c">Frame 属性</text><rect x="633" y="174" width="27" height="27" rx="9" fill="#fff" stroke="#b7c1ce" stroke-width="2"/><text x="644" y="188" dominant-baseline="middle" text-anchor="middle" font-size="25" fill="#24374c">✓</text><text x="670" y="188" dominant-baseline="middle" text-anchor="start" font-size="22" fill="#24374c">裁剪内容</text><text x="633" y="242" dominant-baseline="middle" text-anchor="start" font-size="20" fill="#24374c">隐藏画框外内容</text><text x="633" y="282" dominant-baseline="middle" text-anchor="start" font-size="20" fill="#24374c">当前：已开启</text><text x="440" y="451" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#24374c">教学布局：状态、动作、作用说明同时可见。不是 Figma 原界面。</text></g></svg>